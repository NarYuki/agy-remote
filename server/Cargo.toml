[workspace]
resolver = "2"
members = [
    "agy-p2p-common",
    "agy-p2p-ffi",
    "agy-connector",
    "agy-p2p-jni",
    "agy-release",
]

[workspace.dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring"] }
n0-mainline = "0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
url = "2"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }

